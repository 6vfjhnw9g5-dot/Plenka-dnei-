<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плёнка дней</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: тёплый, личный, немного дерзкий — «a little life lately»
   IDEA: тёмный скрапбук: фото в белых рамках, розовые бирки на булавках, вырезанные наклейки
   PICTURE: страница-воспоминание 9:16, которая сама собирается из текста, фото и песни
   COLOUR and TYPE: почти чёрный, белый, бледно-розовый #ffdbe9 с ягодным #c45d8f; Inter 700/400
   LAYOUT: шапка → архив-коллаж или форма в окошке → полноэкранная страница с объяснением */
:root{color-scheme:dark;--bg:#121011;--card:#1b1719;--line:#2c2528;--ink:#fff;--soft:#c9bcc1;--pink:#ffdbe9;--berry:#c45d8f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) radial-gradient(#ffffff0d 1px,transparent 1.4px) 0 0/22px 22px;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px)}
header{padding:28px 0 8px;position:relative;min-height:440px}
#hero{position:absolute;inset:0 calc(-1*max(4vw,16px));width:calc(100% + 2*max(4vw,16px));height:100%;pointer-events:none}
.htxt{position:relative;max-width:480px;padding-top:20px}
.sub{color:var(--soft);font-size:16px;max-width:30ch;margin:14px 0 0}
.marq{overflow:hidden;background:var(--pink);color:#1d1418;font:700 15px Inter;white-space:nowrap;rotate:-1.2deg;margin:26px -20px 6px;box-shadow:0 8px 20px #0008;border-top:3px dashed var(--berry);border-bottom:3px dashed var(--berry)}
.marq div{display:inline-block;padding:9px 0;animation:mq 26s linear infinite}
.marq span{margin:0 16px}
@keyframes mq{to{transform:translateX(-50%)}}
.card::before{content:"";position:absolute;top:-12px;left:32%;width:76px;height:22px;translate:-50% 0;rotate:-4deg;background:var(--tp);opacity:.92;z-index:2}
.add{background:#ffe66b!important;color:#3a2a10!important;border:0!important;border-radius:2px!important;rotate:2deg;box-shadow:0 10px 22px #000a;font:700 20px/1.3 Inter!important}
.kick{color:var(--soft);font-size:13px;font-weight:500}
h1{font:700 clamp(40px,8vw,64px)/.98 Inter;letter-spacing:-.04em;margin:8px 0 0}
h1 span{color:var(--pink)}

.tabs{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap}
.tab{min-height:44px;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.tab.on{background:var(--pink);color:#1d1418;border-color:var(--pink)}
.week{display:flex;gap:10px;align-items:center;margin:18px 0 6px;flex-wrap:wrap;color:var(--soft);font-size:13px}
.dot{width:14px;height:14px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,44vw),1fr));gap:26px 18px;padding:18px 0 40px}
.card{position:relative;background:#fff;padding:7px 7px 10px;border:0;text-align:left;color:#1d1418;transform:rotate(var(--r,0deg));transition:transform .2s;box-shadow:0 10px 22px #000a}
.card:hover{transform:rotate(0) scale(1.03)}
.card img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#2a2326}
.card b{display:block;font:700 15px/1.2 Inter;margin-top:8px;letter-spacing:-.01em}
.card small{color:#6f6268;font-size:12.5px}
.mtag{position:absolute;right:-8px;top:-10px;background:var(--pink);color:#1d1418;font:600 12px Inter;padding:4px 10px;border-left:3px solid var(--berry);border-right:3px solid var(--berry);rotate:5deg;white-space:nowrap}
.demo{position:absolute;left:12px;top:12px;background:#000a;color:#fff;font:500 11px Inter;padding:2px 7px;border-radius:4px}
.add{display:grid;place-items:center;min-height:250px;border:1.5px dashed #5a4a51;border-radius:6px;background:transparent;color:var(--pink);font:600 18px/1.3 Inter;text-align:center}
.note{color:var(--soft);font-size:13.5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-bottom:40px}
.ghost{background:transparent;border:1px solid #4a3e43;border-radius:999px;min-height:40px;padding:6px 14px;color:var(--soft)}
form{max-width:620px;margin:18px auto 60px;display:grid;gap:16px}
.win{background:#f7f6f6;color:#1d1418;border-radius:12px;overflow:hidden;box-shadow:0 12px 30px #000a}
.bar{height:28px;background:#e7e5e6;display:flex;align-items:center;gap:6px;padding:0 12px}
.bar i{width:10px;height:10px;border-radius:50%}
.win .in{padding:14px 16px 16px;display:grid;gap:10px}
.lab{font:600 13px Inter;color:var(--berry)}
textarea{width:100%;border:0;background:transparent;font:400 17px/1.5 Inter;color:#1d1418;resize:vertical;min-height:120px;padding:0}
textarea:focus{outline:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.box .lab{color:var(--pink)}
input[type=file],input[type=url],input[type=text],input[type=date]{width:100%;min-height:44px;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid #3a3135;background:#120f10;color:#fff}
.prev{display:flex;gap:8px;flex-wrap:wrap}.prev img{width:72px;height:90px;object-fit:cover;border:5px solid #fff;box-shadow:0 4px 10px #0008}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid #3a3135;background:#120f10;font-size:14px}
.chip.on{background:var(--pink);color:#1d1418;border-color:var(--pink)}
.hint{margin:0;color:var(--soft);font-size:13px}
.big{min-height:56px;border:0;border-radius:28px;background:var(--pink);color:#1d1418;font:600 17px Inter}
.big:disabled{opacity:.6}
.msg{min-height:1.4em;margin:0;color:var(--pink);font-size:14px}
.view{position:fixed;inset:0;z-index:20;background:#0c0a0b;overflow:auto}
.vin{display:grid;grid-template-columns:auto minmax(0,400px);gap:clamp(16px,3vw,36px);justify-content:center;align-items:start;padding:clamp(12px,3vw,32px)}
#cv{display:block;height:min(90vh,860px);aspect-ratio:9/16;width:auto;border-radius:14px;box-shadow:0 16px 40px #000c;background:#000}
.side{display:grid;gap:14px}
.vtitle{font:700 28px/1.1 Inter;letter-spacing:-.02em;border:0;border-bottom:1px dashed #4a3e43;background:transparent;padding:4px 0;width:100%;color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button,.btns a{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid #3a3135;background:var(--card);font-weight:600;font-size:14px;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.btns .pri{background:var(--pink);color:#1d1418;border-color:var(--pink)}
.x{justify-self:end}
.why{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.why h3{font:700 16px Inter;margin:6px 0 0}
.why p{margin:0;font-size:14.5px;color:#e9e1e4}
.meter{display:grid;grid-template-columns:5em 1fr 3em;align-items:center;gap:10px;font-size:13px;color:var(--soft)}
.track{height:8px;border-radius:4px;background:#2c2528;position:relative;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;border-radius:4px}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchips span{font-size:13px;padding:3px 10px;border-radius:999px;background:#2c2528}
.wchips .p{background:#4a2335;color:var(--pink)}.wchips .n{background:#232a40;color:#c9d4ff}
.sw{display:flex;gap:6px}.sw span{width:28px;height:28px;border-radius:50%;border:2px solid #fff}
#vOut video{width:100%;max-height:46vh;background:#000;border-radius:10px}
.load{position:fixed;right:16px;bottom:16px;z-index:30;background:var(--pink);color:#1d1418;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 20px #000a}
@media(max-width:820px){.vin{grid-template-columns:minmax(0,1fr)}#cv{height:auto;width:min(100%,calc(78vh*.5625));margin:0 auto}}
@media(max-width:700px){header{min-height:700px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.marq div{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <canvas id="hero" aria-hidden="true"></canvas>
  <div class="htxt"><div class="kick">плёнка дней · дневник, который помнит настроение</div>
  <h1>немного<br><span id="hl">моей жизни</span></h1>
  <p class="sub">Пара строк, фото и песня — и день сам становится страницей скрапбука в своём настроении.</p>
  <nav class="tabs"><button class="tab on" id="tA">Дневник</button><button class="tab" id="tN">+ Новый день</button></nav></div>
</header>
<div class="marq" aria-hidden="true"><div id="mq"></div></div>
<main>
  <section id="arch">
    <div class="week" id="legend"></div>
    <div class="grid" id="grid"></div>
    <div class="note" id="demoNote" hidden><span>Демо-страницы собраны из фото Pexels, песни указаны только названием.</span><button class="ghost" id="rmDemo">Убрать демо</button></div>
  </section>
  <section id="new" hidden>
    <form id="f" novalidate>
      <div class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
        <div class="in"><label class="lab" for="fText">как прошёл день? расскажи, как подруге</label>
        <textarea id="fText" placeholder="Где была, с кем, какая погода, что запомнилось…"></textarea></div></div>
      <div class="box"><label class="lab" for="fDate">дата</label><input type="date" id="fDate"></div>
      <div class="box"><label class="lab" for="fPh">фото дня, от 1 до 6</label><input type="file" id="fPh" accept="image/*" multiple><div class="prev" id="phPrev"></div></div>
      <div class="box"><span class="lab">песня дня</span>
        <label class="hint" for="fAu">аудиофайл: темп и энергию посчитаем сами</label><input type="file" id="fAu" accept="audio/*">
        <label class="hint" for="fName">исполнитель и название</label><input type="text" id="fName" placeholder="Frank Sinatra — Autumn Leaves">
        <label class="hint" for="fLink">или ссылка на песню</label><input type="url" id="fLink" placeholder="https://">
        <span class="hint">если нет файла, подскажи темп</span>
        <div class="chips" data-k="tempo"><button type="button" class="chip on" data-v="">сам определи</button><button type="button" class="chip" data-v="0.15">медленная</button><button type="button" class="chip" data-v="0.55">средняя</button><button type="button" class="chip" data-v="0.9">быстрая</button></div>
        <div class="chips" data-k="mood"><button type="button" class="chip on" data-v="">сам определи</button><button type="button" class="chip" data-v="0.7">светлая</button><button type="button" class="chip" data-v="-0.7">грустная</button></div>
      </div>
      <button class="big" id="fGo">собрать воспоминание</button>
      <p class="msg" id="fMsg" role="status"></p>
    </form>
  </section>
</main>
</div>
<div class="view" id="view" hidden>
  <div class="vin">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <aside class="side">
      <button class="ghost x" id="vClose">закрыть ✕</button>
      <input class="vtitle" id="vTitle" aria-label="Название папки дня">
      <div class="btns"><button class="pri" id="vPlay">▶ смотреть с песней</button><button id="vVoice">озвучить</button><button id="vRec">записать видео</button></div>
      <div id="vSong" class="hint"></div>
      <div id="vOut"></div>
      <div class="why" id="vWhy"></div>
      <button class="ghost" id="vDel">удалить день</button>
    </aside>
  </div>
</div>
<div class="load" id="load" hidden></div>
<script>
{
const $=s=>document.querySelector(s);
const W=540,H=960,D=20;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const rng=s=>{s=(s%2147483646)+1;return()=>(s=s*16807%2147483647)/2147483647};
const hash=str=>{let h=7;for(const c of str)h=(h*31+c.charCodeAt(0))%2147483646;return h};
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const PINK='#ffdbe9',BERRY='#c45d8f',INK='#1d1418';

const MOODS={
  warm:{name:'Тепло',sub:'спокойно и тепло',dot:'#f2b07a',tint:[46,24,12],ta:.55,why:'Медленная песня и тёплые слова. Фото в тёплом фильтре, полароиды плавно сменяют друг друга, лилии и бантики, кадры приближаются медленно.',voice:[.92,1]},
  bright:{name:'Ярко',sub:'радостно и шумно',dot:'#ff5aa0',tint:[40,8,26],ta:.5,why:'Быстрый темп и радостные слова. Цвета насыщеннее, фото «выпрыгивают» в ритм песни, георгины, вишни, звёзды и конфетти.',voice:[1.1,1.15]},
  tense:{name:'Напряжённо',sub:'на пределе',dot:'#e0353f',tint:[6,8,16],ta:.72,why:'Высокая энергия и тревожные слова. Холодный контрастный фильтр, сетка, резкие склейки по биту, чек вместо расписания, красная рамка пульсирует.',voice:[1.05,.8]},
  quiet:{name:'Тихо',sub:'тихо и грустно',dot:'#8fa3c7',tint:[10,12,18],ta:.72,why:'Медленно и грустно. Одно фото за раз, много пустоты, приглушённые цвета, дождь или снег, долгие паузы.',voice:[.82,.9]}};

/* ---------- хранилище ---------- */
let db=null,mem=[];
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('plenka-dnei',1);q.onupgradeneeded=()=>q.result.createObjectStore('days',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
const store=m=>db.transaction('days',m).objectStore('days');
function loadAll(){return new Promise(r=>{if(!db)return r();try{const q=store('readonly').getAll();q.onsuccess=()=>{mem=q.result||[];r()};q.onerror=()=>r()}catch(e){r()}})}
function putDay(d){mem=mem.filter(x=>x.id!==d.id).concat(d);return new Promise(r=>{if(!db)return r();try{const q=store('readwrite').put(d);q.onsuccess=r;q.onerror=r}catch(e){r()}})}
function delDay(id){mem=mem.filter(x=>x.id!==id);cache.delete(id);return new Promise(r=>{if(!db)return r();try{const q=store('readwrite').delete(id);q.onsuccess=r;q.onerror=r}catch(e){r()}})}

/* ---------- картинки ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=typeof src==='string'?src:URL.createObjectURL(src)})}
const toBlob=(c,q=.86)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function shrink(file){const i=await loadImg(file);const s=Math.min(1,1300/Math.max(i.width,i.height));const c=mk(Math.round(i.width*s),Math.round(i.height*s));c.getContext('2d').drawImage(i,0,0,c.width,c.height);return toBlob(c)}
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=(mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4)*60}return[h,s,l]}
function photoStats(imgs){const px=[];let sat=0,bri=0,warm=0,n=0;for(const i of imgs){const c=mk(40,40),x=c.getContext('2d');x.drawImage(i,0,0,40,40);const d=x.getImageData(0,0,40,40).data;for(let k=0;k<d.length;k+=4){const r=d[k],g=d[k+1],b=d[k+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);px.push([r,g,b]);sat+=mx?(mx-mn)/mx:0;bri+=mx/255;warm+=(r-b)/255;n++}}
  return{sat:sat/n,bri:bri/n,warm:warm/n,palette:kmeans(px,5)}}
function kmeans(px,k){let cs=[...Array(k)].map((_,i)=>px[Math.floor((i+.5)*px.length/k)].slice());for(let it=0;it<8;it++){const s=cs.map(()=>[0,0,0,0]);for(const p of px){let bi=0,bd=1e9;for(let j=0;j<k;j++){const c=cs[j],d=(c[0]-p[0])**2+(c[1]-p[1])**2+(c[2]-p[2])**2;if(d<bd){bd=d;bi=j}}const t=s[bi];t[0]+=p[0];t[1]+=p[1];t[2]+=p[2];t[3]++}cs=cs.map((c,j)=>s[j][3]?[s[j][0]/s[j][3],s[j][1]/s[j][3],s[j][2]/s[j][3]]:c);cs._n=s.map(v=>v[3])}
  return cs.map((c,j)=>[c,cs._n?cs._n[j]:0]).sort((a,b)=>b[1]-a[1]).map(v=>v[0].map(Math.round))}

/* фильтр фото под настроение */
function proc(img,m){const s=Math.min(1,720/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s);const c=mk(w,h),x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const im=x.getImageData(0,0,w,h),d=im.data;
  for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];const L=.3*r+.59*g+.11*b;
    if(m==='warm'){r=r*1.05+14;g=g*1.0+6;b=b*.86+4}
    else if(m==='bright'){r=L+(r-L)*1.4;g=L+(g-L)*1.4;b=L+(b-L)*1.4;r=(r-128)*1.08+132;g=(g-128)*1.08+128;b=(b-128)*1.08+130}
    else if(m==='tense'){r=L+(r-L)*.45;g=L+(g-L)*.45;b=L+(b-L)*.45;r=(r-128)*1.3+124;g=(g-128)*1.3+128;b=(b-128)*1.3+140}
    else{r=L+(r-L)*.28;g=L+(g-L)*.28;b=L+(b-L)*.28;r=r*.82+30;g=g*.82+32;b=b*.82+40}
    d[i]=r;d[i+1]=g;d[i+2]=b}
  x.putImageData(im,0,0);return c}
function blurBg(img,m){const c=mk(W,H),x=c.getContext('2d');const t=mk(18,32),tx=t.getContext('2d');const r=Math.max(18/img.width,32/img.height),sw=18/r,sh=32/r;tx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,18,32);
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(t,0,0,W,H);const M=MOODS[m];x.fillStyle=css(M.tint,M.ta);x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W/2,H*.42,H*.2,W/2,H*.5,H*.8);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=g;x.fillRect(0,0,W,H);
  const g2=x.createLinearGradient(0,H*.7,0,H);g2.addColorStop(0,'rgba(0,0,0,0)');g2.addColorStop(1,'rgba(0,0,0,.75)');x.fillStyle=g2;x.fillRect(0,H*.7,W,H*.3);return c}

/* ---------- анализ текста ---------- */
const LEX={
  pos:['счаст','радост','рад','весел','смея','смех','люб','кайф','тепл','уют','обня','красив','вкусн','обожа','улыб','круто','отличн','хорош','нрав','какао','солнеч','празд','подар','побед','ура','мечт','восторг','нежн','торт','друз'],
  neg:['грус','тоск','плак','устал','скуч','одинок','страш','страх','боял','злю','злил','злост','бесит','бесил','ненав','плох','тяжел','болит','больно','болел','ссор','обид','провал','ужас','стресс','трев','нерв','разочар','пуст','никого'],

const PLACES=[['парк','парк','в парке','m'],['офис','офис','в офисе','m'],['мор','море','у моря','n'],['пляж','пляж','на пляже','m'],['дом','дом','дома','m'],['кафе','кафе','в кафе','n'],['кофейн','кофейня','в кофейне','f'],['школ','школа','в школе','f'],['универ','универ','в универе','m'],['горах','горы','в горах','p'],['=горы','горы','в горах','p'],['город','город','в городе','m'],['улиц','улица','на улице','f'],['озер','озеро','у озера','n'],['=лес','лес','в лесу','m'],['лесу','лес','в лесу','m'],['окн','окно','у окна','n'],['дач','дача','на даче','f']];

const TIMES=[['ноч',['ночь','f']],['вечер',['вечер','m']],['закат',['вечер','m']],['утр',['утро','n']],['рано',['утро','n']],['рассвет',['утро','n']],['днем',['день','m']],['обед',['день','m']]];
const hit=(w,s)=>s[0]==='='?w===s.slice(1):w.startsWith(s);
function analyzeText(text){const words=(text.toLowerCase().replace(/ё/g,'е').match(/[а-яa-z]+/g)||[]);const m={};
  for(const k in LEX)m[k]=[...new Set(words.filter(w=>LEX[k].some(s=>hit(w,s))))];
  const find=list=>{for(const e of list)if(words.some(w=>hit(w,e[0])))return e;return null};
  const p=find(PLACES),o=find(OBJS),pe=find(PEOPLE),ev=find(EVENTS),ti=find(TIMES);
  const pos=m.pos.length,neg=m.neg.length,ten=m.tense.length;
  const energy=clamp(.45+.13*m.en.length+.1*ten-.09*m.calm.length);
  const val=clamp((pos-neg-.5*ten)/(pos+neg+.5*ten+1)*1.6,-1,1);
  return{words:m,energy,val,raw:words.join(' '),f:{place:p&&{nom:p[1],prep:p[2],g:p[3]},obj:o&&o[1],people:pe&&pe[1],event:ev&&ev[1],time:ti&&{w:ti[1][0],g:ti[1][1]}}}}
function moments(text){const parts=text.split(/[.!?;]+|,\s*(?:а|но|и)?\s*/i).map(s=>s.trim()).filter(s=>s.length>3);
  return parts.slice(0,3).map(s=>{const l=s.toLowerCase();const lab=/ноч/.test(l)?'ночь':/вечер|закат/.test(l)?'вечер':/утр|рано|рассвет|проснул/.test(l)?'утро':/днём|днем|обед/.test(l)?'днём':'';return{lab,t:s.length>30?s.slice(0,29).replace(/\s\S*$/,'')+'…':s}})}

/* ---------- анализ песни ---------- */
async function analyzeAudio(blob){try{const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();const buf=await ac.decodeAudioData(await blob.arrayBuffer());try{ac.close()}catch(e){}
  const sr=buf.sampleRate,ch=buf.getChannelData(0),start=Math.floor(Math.min(buf.duration*.25,30)*sr),len=Math.min(ch.length-start,sr*40),hop=Math.floor(sr/100);const env=[];let zc=0,tot=0,sum=0;
  for(let i=start;i+hop<start+len;i+=hop){let e=0;for(let j=0;j<hop;j++){const v=ch[i+j];e+=v*v;if(j&&(v>0)!==(ch[i+j-1]>0))zc++}tot+=hop;sum+=e;env.push(Math.sqrt(e/hop))}
  const on=env.map((v,i)=>i?Math.max(0,v-env[i-1]):0);let best=-1,bl=50;for(let l=33;l<=100;l++){let s=0;for(let i=l;i<on.length;i++)s+=on[i]*on[i-l];s/=Math.max(1,on.length-l);if(s>best){best=s;bl=l}}
  let bpm=6000/bl;while(bpm<70)bpm*=2;while(bpm>170)bpm/=2;const rms=Math.sqrt(sum/Math.max(1,tot)),zcr=zc/Math.max(1,tot);
  return{bpm:Math.round(bpm),e:clamp((bpm-70)/90)*.5+clamp(rms/.22)*.5,light:clamp((zcr-.03)/.1)}}catch(e){return null}}

/* ---------- правило: настроение → приём ---------- */
function decide(tx,ph,au,man){const E=[[tx.energy,.4],[clamp(ph.sat*1.3),.15]],V=[[tx.val,.6],[clamp(ph.warm*2+(ph.bri-.5),-1,1),.2]];
  if(au){E.push([au.e,.45]);V.push([au.light*2-1,.15])}
  if(man.tempo!=='')E.push([+man.tempo,.7]);if(man.mood!=='')V.push([+man.mood,.55]);
  const avg=a=>a.reduce((s,[v,w])=>s+v*w,0)/a.reduce((s,[,w])=>s+w,0);const energy=avg(E),val=avg(V);
  const mood=energy>=.5?(val>=0?'bright':'tense'):(val>=0?'warm':'quiet');
  const bpm=au?au.bpm:Math.round(man.tempo!==''?65+man.tempo*100:60+energy*90);return{energy,val,mood,bpm}}
const SEAS=['зима','зима','весна','весна','весна','лето','лето','лето','осень','осень','осень','зима'];
const SA={'зима':['Зимний','Зимняя','Зимнее','Зимние'],'весна':['Весенний','Весенняя','Весеннее','Весенние'],'лето':['Летний','Летняя','Летнее','Летние'],'осень':['Осенний','Осенняя','Осеннее','Осенние']};
const GI={m:0,f:1,n:2,p:3},QUIET={m:'Тихий',f:'Тихая',n:'Тихое'};
const DEF_T={warm:{w:'вечер',g:'m'},bright:{w:'день',g:'m'},tense:{w:'ночь',g:'f'},quiet:{w:'утро',g:'n'}};
const cap=s=>s[0].toUpperCase()+s.slice(1);
function nameDay(m,f,season){const t=f.time||DEF_T[m];let s;
  if(m==='warm')s=f.place&&f.obj?`${SA[season][GI[f.place.g]]} ${f.place.nom} и ${f.obj}`:`${SA[season][GI[t.g]]} ${t.w} ${f.people||(f.place&&f.place.prep)||'и '+(f.obj||'тёплый свет')}`;
  else if(m==='bright')s=`${cap(t.w)} ${f.place?f.place.prep:''} ${f.people||(f.obj?'и '+f.obj:'и смех')}`;
  else if(m==='tense')s=`${cap(t.w)} ${f.place?f.place.prep:'без сна'} ${f.event||'на пределе'}`;
  else s=`${QUIET[t.g]||'Тихий'} ${t.w} ${f.place?f.place.prep:(f.obj?'и '+f.obj:'наедине с собой')}`;
  return s.replace(/\s+/g,' ').trim().split(' ').slice(0,7).join(' ')}
const firstSentence=t=>{const s=(t.trim().split(/(?<=[.!?…])\s/)[0]||'').trim();return s.length>88?s.slice(0,85).replace(/\s\S*$/,'')+'…':s};
function weatherOf(raw,season){if(/дожд/.test(raw))return'rain';if(/снег/.test(raw)||season==='зима')return'snow';if(season==='осень'||/лист/.test(raw))return'leaves';return'motes'}

async function buildDay(o){const imgs=await Promise.all(o.photos.map(loadImg));const ph=photoStats(imgs);const au=o.song.blob?await analyzeAudio(o.song.blob):null;const tx=analyzeText(o.text);
  const dec=decide(tx,ph,au,o.man);const season=SEAS[+o.date.slice(5,7)-1];
  const day={id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:o.date,text:o.text,photos:o.photos,song:o.song,man:o.man,mood:dec.mood,title:nameDay(dec.mood,tx.f,season),caption:firstSentence(o.text),moments:moments(o.text),
    an:{energy:dec.energy,val:dec.val,bpm:dec.bpm,words:tx.words,ph,au,season,weather:weatherOf(tx.raw,season)},demo:!!o.demo};
  const P=await prepare(day);day.thumb=thumbOf(day,P);day.thumbV=4;return day}

  else if(kind==='snow'){const y=(ph+t*38*sp)%H;x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.arc(sx+Math.sin(t+k)*10,y,1.6+sp*1.8,0,7);x.fill()}
  else if(kind==='leaves'){if(k%3)continue;const y=(ph+t*46*sp)%(H+60)-30;x.save();x.translate(sx+Math.sin(t*.8+k)*26,y);x.rotate(t*sp+k);x.fillStyle=['#e8862e','#f2b33d','#c9532a'][k%3];x.globalAlpha=.85;x.beginPath();x.ellipse(0,0,9,4.5,0,0,7);x.fill();x.restore()}
  else{const y=(ph-t*14*sp+H)%H;x.fillStyle='rgba(255,230,200,.35)';x.beginPath();x.arc(sx,y,1.4+sp*1.6,0,7);x.fill()}}x.restore()}

$('#vClose').onclick=()=>{if(recBusy)return;stopAudio();cur=null;cancelAnimationFrame(raf);$('#view').hidden=true;document.body.style.overflow=''};
$('#vTitle').onchange=async()=>{const v=$('#vTitle').value.trim();if(!cur||!v)return;cur.title=v;cur.thumb=thumbOf(cur,P);await putDay(cur);renderGrid()};
$('#vPlay').onclick=()=>{if(audio){stopAudio();return}t0=performance.now();if(cur.song&&cur.song.blob){audio=new Audio(URL.createObjectURL(cur.song.blob));audio.loop=true;audio.play().catch(()=>{});$('#vPlay').textContent='❚❚ пауза'}else $('#vOut').innerHTML='<p class="hint">У этого дня нет аудиофайла, страница играет без музыки.</p>'};
$('#vVoice').onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur.text);u.lang='ru-RU';const v=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang));if(v)u.voice=v;[u.rate,u.pitch]=MOODS[cur.mood].voice;speechSynthesis.speak(u)}catch(e){$('#vOut').innerHTML='<p class="hint">Озвучка не поддерживается этим браузером.</p>'}};
$('#vDel').onclick=async()=>{if(!cur||recBusy)return;const b=$('#vDel');if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='точно удалить? нажми ещё раз';setTimeout(()=>{b.dataset.sure='';b.textContent='удалить день'},3000);return}b.dataset.sure='';b.textContent='удалить день';await delDay(cur.id);$('#vClose').onclick();renderGrid()};
let dl=null;try{window.claude&&window.claude.use&&window.claude.use('downloads').then(v=>{dl=v}).catch(()=>{})}catch(e){}
$('#vRec').onclick=async()=>{if(recBusy||!cur)return;const out=$('#vOut');if(!window.MediaRecorder||!cv.captureStream){out.innerHTML='<p class="hint">Этот браузер не умеет записывать видео. Запиши экран телефона.</p>';return}
  stopAudio();recBusy=true;const stream=cv.captureStream(30);let ac=null,el=null;
  if(cur.song&&cur.song.blob){try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();el=new Audio(URL.createObjectURL(cur.song.blob));const src=ac.createMediaElementSource(el),dst=ac.createMediaStreamDestination();src.connect(dst);src.connect(ac.destination);dst.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr))}catch(e){}}
  const mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  let rec;try{rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:10e6}:{})}catch(e){recBusy=false;out.innerHTML='<p class="hint">Запись не запустилась. Запиши экран телефона.</p>';return}
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{recBusy=false;$('#vRec').textContent='записать видео';if(el)el.pause();try{ac&&ac.close()}catch(e){}const b=new Blob(chunks,{type:rec.mimeType||mt||'video/webm'}),u=URL.createObjectURL(b),ext=b.type.includes('mp4')?'mp4':'webm',fn=cur.title+'.'+ext;
    out.innerHTML=`<video src="${u}" controls playsinline></video><div class="btns" style="margin-top:8px"><button id="vSave">сохранить видео</button><a href="${u}" download="${esc(fn)}">скачать файлом</a></div>`;
    $('#vSave').onclick=async()=>{try{if(dl){await dl.save({filename:fn,data:b});return}}catch(e){}const a=document.createElement('a');a.href=u;a.download=fn;a.click()};if(dl)out.querySelector('a').remove();else $('#vSave').remove()};
  t0=performance.now();if(el)el.play().catch(()=>{});rec.start(250);let left=D;$('#vRec').textContent=`запись… ${left} с`;
  const iv=setInterval(()=>{left--;$('#vRec').textContent=`запись… ${left} с`;if(left<=0){clearInterval(iv);rec.stop()}},1000)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#view').hidden)$('#vClose').onclick()});

(async()=>{try{await Promise.all(['400 16px Inter','700 46px Inter'].map(f=>document.fonts.load(f)))}catch(e){}
    await openDB();await loadAll();
  let seeded=false;try{seeded=localStorage.getItem('plenka-dnei-seeded-v2')==='1'}catch(e){}
  if(!mem.length&&!seeded){busy('Раскладываю демо-страницы…');for(const dm of DEMOS){try{const d=await buildDay({...dm,song:{...dm.song,blob:null},demo:true});await putDay(d)}catch(e){}}try{localStorage.setItem('plenka-dnei-seeded-v2','1')}catch(e){}busy('')}
  renderGrid()})();
}
</script>
</body>
</html>
